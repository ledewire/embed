<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vimeo Embed Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      color: white;
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 2rem;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .video-wrapper {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .video-container {
      position: relative;
      padding: 56.25% 0 0 0; /* 16:9 Aspect Ratio */
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .video-info {
      padding: 1.5rem;
      background: white;
    }

    .video-info h2 {
      font-size: 1.25rem;
      color: #1f2937;
      margin-bottom: 0.5rem;
    }

    .video-info p {
      color: #6b7280;
      font-size: 0.875rem;
    }
  </style>
</head>

<body>
  <h1>🎥 LedeWire Video Paywall Demo</h1>
  
  <div class="video-wrapper">
    <div class="video-container">
      <iframe
        src="https://player.vimeo.com/video/1137650125?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;muted=1&amp;loop=1&amp;controls=1"
        frameborder="0" 
        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        title="Testing Vimeo"
        id="vimeo-player">
      </iframe>
    </div>
    
    <div class="video-info">
      <h2>Testing Vimeo</h2>
      <p>Premium video content • Unlock to watch full video</p>
    </div>
  </div>

  <script src="https://player.vimeo.com/api/player.js"></script>
  <script 
    type="module" 
    src="/src/main.tsx" 
    data-content-id="972e539f-effd-4bd3-b550-0b94b421118f" 
    data-price="40" 
    data-creator-id="creator_456"
    data-player="vimeo">
  </script>
</body>

</html>
